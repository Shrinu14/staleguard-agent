# Freshness benchmark: 20 snippets, 10 using a stale API and 10 using the current one.
# `target` is the API whose verdict is graded; `requirement` is what the repo pins
# (written to requirements.txt), so the judge compares with the right version.
# expected = "changed" (stale) or "supported" (current). Ground truth is from the
# libraries' own migration guides / changelogs, not from this tool.

# ── stale (expected: changed) ────────────────────────────────
[[snippet]]
id = "openai-chatcompletion"
requirement = "openai>=1.40"
target = "openai.ChatCompletion.create"
expected = "changed"
code = '''
import openai
r = openai.ChatCompletion.create(model="gpt-4o-mini", messages=[{"role": "user", "content": "hi"}])
'''

[[snippet]]
id = "openai-completion"
requirement = "openai>=1.40"
target = "openai.Completion.create"
expected = "changed"
code = '''
import openai
r = openai.Completion.create(model="gpt-3.5-turbo-instruct", prompt="Say hi")
'''

[[snippet]]
id = "openai-embedding"
requirement = "openai>=1.40"
target = "openai.Embedding.create"
expected = "changed"
code = '''
