e = openai.Embedding.create(model="text-embedding-3-small", input="hello")
'''

[[snippet]]
id = "pydantic-dict"
requirement = "pydantic>=2.7"
target = "pydantic.BaseModel.dict"
expected = "changed"
code = '''
from pydantic import BaseModel
class User(BaseModel):
    name: str
data = User(name="a").dict()
'''

[[snippet]]
id = "pydantic-parse-obj"
requirement = "pydantic>=2.7"
target = "pydantic.BaseModel.parse_obj"
expected = "changed"
code = '''
from pydantic import BaseModel
class User(BaseModel):
    name: str
u = User.parse_obj({"name": "a"})
'''

[[snippet]]
id = "pydantic-validator"
requirement = "pydantic>=2.7"
target = "pydantic.validator"
expected = "changed"
code = '''
from pydantic import BaseModel, validator
class User(BaseModel):
    name: str
    @validator("name")
    def not_empty(cls, v):
        return v
'''

