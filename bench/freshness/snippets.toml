[[snippet]]
id = "pydantic-field-validator"
requirement = "pydantic>=2.7"
target = "pydantic.field_validator"
expected = "supported"
code = '''
from pydantic import BaseModel, field_validator
class User(BaseModel):
    name: str
    @field_validator("name")
